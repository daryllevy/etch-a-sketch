<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Ajout des polices personnalisées -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bitcount+Grid+Double:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bitcount+Grid+Double:wght@100..900&family=Courgette&display=swap"
      rel="stylesheet"
    />
    <!--  -->
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
    <title>Etch a Sketch</title>
  </head>
  <body>
    <div class="sketch">
      <h1>Web Etch a Sketch</h1>
      <div class="btns-top">
        <input type="color" name="color-picked" id="pick-color" />
        <button class="clear">clear</button
        ><button class="eraser">eraser</button>
        <button class="rainbow">Rainbow mode</button>
        <button class="toggle">Toggle Grid</button>
      </div>
      <div class="container"></div>
      <div class="new-grid">
        <input
          type="range"
          name="grid"
          id="grid-proportion"
          min="8"
          max="64"
          value="16"
          step="4"
        />
        <span></span>
      </div>
    </div>
  </body>
</html>
